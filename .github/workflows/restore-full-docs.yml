name: Restore full docs

on:
  push:
    branches:
      - 'docs/sync-r5'
    paths:
      - '.github/workflows/restore-full-docs.yml'
      - 'scripts/sync_catalogs.py'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/sync-r5
          fetch-depth: 0
      - name: Restore catalogs from main
        run: git checkout origin/main -- wiki/Items.md wiki/Commands.md wiki/Home.md wiki/FAQ.md docs/VERSION.md
      - name: Sync catalogs to source
        run: python3 scripts/sync_catalogs.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wiki/Items.md wiki/Commands.md wiki/Home.md wiki/FAQ.md docs/VERSION.md
          if git diff --cached --quiet; then echo no changes; exit 0; fi
          git commit -m "docs: sync Items.md and Commands.md to source registries"
          git push origin HEAD:docs/sync-r5
