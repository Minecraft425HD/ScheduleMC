name: Restore full docs

on:
  push:
    branches:
      - 'docs/sync-r2'
    paths:
      - '.github/workflows/restore-full-docs.yml'
      - 'scripts/restore_full_docs.py'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/sync-r2
          fetch-depth: 0

      - name: Restore docs tree from main
        run: git checkout origin/main -- README.md docs wiki

      - name: Patch claims in all markdown
        run: python3 scripts/restore_full_docs.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs wiki
          if git diff --cached --quiet; then
            echo no changes
            exit 0
          fi
          git commit -m "docs: round-2 restore from main and patch remaining claims"
          git push origin HEAD:docs/sync-r2
